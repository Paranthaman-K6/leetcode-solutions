<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="leetcode-solutions — terminal banner: python scripts/generate_readme.py; LeetCode Solutions; solve, understand, improve">
  <title>leetcode-solutions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e9e9e"/>
      <stop offset="1" stop-color="#2d2d2d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2d2d2d"/>
    </pattern>
    <clipPath id="c-prompt">
      <rect x="0" y="56" width="900" height="34">
        <animate attributeName="width" from="0" to="900" dur="1s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c-title">
      <rect x="0" y="96" width="900" height="66">
        <animate attributeName="width" from="0" to="900" dur="1.1s" begin="1.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c-tagline">
      <rect x="0" y="170" width="900" height="30">
        <animate attributeName="width" from="0" to="900" dur="0.9s" begin="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .cur { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .pulse { animation: pulse 6s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: .2; } to { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) { .cur, .pulse { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#bg)" stroke="#2d2d2d"/>
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#grid)" class="pulse"/>

  <g fill="#3a3a3a">
    <circle cx="30" cy="28" r="5"/>
    <circle cx="48" cy="28" r="5"/>
    <circle cx="66" cy="28" r="5"/>
  </g>
  <text x="88" y="33" fill="#6e6e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">~/leetcode-solutions — zsh</text>
  <text x="868" y="33" fill="#6e6e6e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">main</text>
  <line x1="1" y1="48" x2="899" y2="48" stroke="#232323"/>

  <g clip-path="url(#c-prompt)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="32" y="84" fill="#9e9e9e">$</text>
    <text x="52" y="84" fill="#e6e6e6">python scripts/generate_readme.py</text>
  </g>
  <text x="32" y="112" fill="#4f4f4f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">indexing accepted submissions · runtime · memory</text>

  <g clip-path="url(#c-title)">
    <text x="30" y="152" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="-1.5">LeetCode Solutions</text>
  </g>
  <rect x="30" y="170" width="320" height="2" fill="url(#rule)"/>

  <g clip-path="url(#c-tagline)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="32" y="196" fill="#9e9e9e"><tspan fill="#5a5a5a">›</tspan> solve · understand · improve</text>
  </g>
  <rect class="cur" x="284" y="184" width="8" height="15" fill="#9e9e9e"/>
</svg>
