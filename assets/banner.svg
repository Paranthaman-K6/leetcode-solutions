<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="LeetCode Solutions — a growing archive of accepted solutions in C and Java">
  <title>LeetCode Solutions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset=".55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9e9e9e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#2d2d2d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2d2d2d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-white" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gray" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9e9e9e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#9e9e9e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <clipPath id="reveal-title">
      <rect x="48" y="130" width="730" height="74">
        <animate attributeName="width" from="0" to="730" dur="1s" begin=".2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="reveal-copy">
      <rect x="48" y="200" width="680" height="130">
        <animate attributeName="width" from="0" to="680" dur=".9s" begin=".7s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .terminal { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .pulse { animation: pulse 5s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#bg)" stroke="#2d2d2d"/>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#dots)"/>
  <ellipse cx="1080" cy="10" rx="340" ry="240" fill="url(#glow-white)" class="pulse"/>
  <ellipse cx="110" cy="330" rx="280" ry="180" fill="url(#glow-gray)"/>
  <rect x="1" y="1" width="1198" height="3" rx="1.5" fill="url(#edge)"/>

  <g>
    <rect x="56" y="44" width="48" height="48" rx="14" fill="url(#brand)"/>
    <text x="80" y="76" text-anchor="middle" class="terminal" font-size="19" font-weight="700" fill="#111111">&lt;/&gt;</text>
  </g>
  <text x="120" y="65" class="sans" font-size="18" font-weight="700" fill="#ffffff">leetcode-solutions</text>
  <text x="120" y="85" class="terminal" font-size="11" fill="#9e9e9e" letter-spacing="1.6">ACCEPTED · MEASURED · INDEXED</text>

  <g clip-path="url(#reveal-title)">
    <text x="54" y="186" class="sans" font-size="62" font-weight="800" letter-spacing="-2" fill="#ffffff">LeetCode <tspan fill="#9e9e9e">Solutions</tspan></text>
  </g>

  <g clip-path="url(#reveal-copy)">
    <text x="57" y="225" class="sans" font-size="18" fill="#9e9e9e">A growing archive of clean, measured solutions.</text>

    <rect x="56" y="252" width="54" height="34" rx="17" fill="#181818" stroke="#2d2d2d"/>
    <text x="83" y="274" text-anchor="middle" class="terminal" font-size="13" fill="#e6e6e6">C</text>
    <rect x="118" y="252" width="74" height="34" rx="17" fill="#181818" stroke="#2d2d2d"/>
    <text x="155" y="274" text-anchor="middle" class="terminal" font-size="13" fill="#e6e6e6">Java</text>
    <rect x="200" y="252" width="166" height="34" rx="17" fill="#181818" stroke="#2d2d2d"/>
    <circle cx="219" cy="269" r="3" fill="#ffffff"/>
    <circle cx="231" cy="269" r="3" fill="#9e9e9e"/>
    <circle cx="243" cy="269" r="3" fill="#ffffff" opacity=".3"/>
    <text x="255" y="274" class="sans" font-size="12" fill="#bdbdbd">Easy → Hard</text>
  </g>

  <text x="58" y="318" class="terminal" font-size="12" fill="#6e6e6e"><tspan fill="#ffffff">›</tspan> solve · understand · improve</text>

  <g filter="url(#shadow)">
    <rect x="756" y="62" width="386" height="226" rx="18" fill="#0a0a0a" stroke="#2d2d2d"/>
    <circle cx="780" cy="88" r="4" fill="#3a3a3a"/>
    <circle cx="796" cy="88" r="4" fill="#3a3a3a"/>
    <circle cx="812" cy="88" r="4" fill="#3a3a3a"/>
    <text x="1118" y="92" text-anchor="end" class="terminal" font-size="11" fill="#6e6e6e">two-sum.c</text>
    <line x1="756" y1="106" x2="1142" y2="106" stroke="#242424"/>

    <circle cx="778" cy="140" r="15" fill="#ffffff" opacity=".06"/>
    <circle cx="778" cy="140" r="15" fill="none" stroke="#9e9e9e" stroke-opacity=".5"/>
    <path d="M771 140 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="804" y="147" class="sans" font-size="19" font-weight="700" fill="#ffffff">Accepted</text>
    <text x="1118" y="147" text-anchor="end" class="terminal" font-size="11" fill="#6e6e6e">Two Sum</text>
    <line x1="756" y1="166" x2="1142" y2="166" stroke="#242424"/>

    <text x="772" y="191" class="sans" font-size="10" fill="#777777" letter-spacing="1.4">RUNTIME</text>
    <text x="772" y="214" class="sans" font-size="18" font-weight="700" fill="#ffffff">0 ms</text>
    <rect x="892" y="202" width="166" height="6" rx="3" fill="#2d2d2d"/>
    <rect x="892" y="202" width="166" height="6" rx="3" fill="#ffffff"/>
    <text x="1118" y="214" text-anchor="end" class="terminal" font-size="11" fill="#ffffff">100.00%</text>

    <text x="772" y="240" class="sans" font-size="10" fill="#777777" letter-spacing="1.4">MEMORY</text>
    <text x="772" y="263" class="sans" font-size="18" font-weight="700" fill="#ffffff">8.8 MB</text>
    <rect x="892" y="251" width="166" height="6" rx="3" fill="#2d2d2d"/>
    <rect x="892" y="251" width="104" height="6" rx="3" fill="#9e9e9e"/>
    <text x="1118" y="263" text-anchor="end" class="terminal" font-size="11" fill="#9e9e9e">62.57%</text>
  </g>
</svg>
