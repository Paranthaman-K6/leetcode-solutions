<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Progress: 13 easy, 6 medium, 1 hard; 20 problems, 21 solutions, 2 languages.">
  <title>Progress</title>
  <desc>Progress: 13 easy, 6 medium, 1 hard; 20 problems, 21 solutions, 2 languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset=".55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#2d2d2d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2d2d2d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-easy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="g-medium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="g-hard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".05"/>
    </pattern>
    <style>
      .terminal { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .bar {
        transform-box: fill-box;
        transform-origin: left center;
        animation: grow .9s cubic-bezier(.2, .8, .2, 1) both;
      }
      .d1 { animation-delay: .2s; }
      .d2 { animation-delay: .35s; }
      .d3 { animation-delay: .5s; }
      @keyframes grow { from { transform: scaleX(0); } }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#bg)" stroke="#2d2d2d"/>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#dots)"/>
  <ellipse cx="1090" cy="0" rx="300" ry="190" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="3" rx="1.5" fill="url(#edge)"/>

  <text x="56" y="54" class="terminal" font-size="11" fill="#9e9e9e" letter-spacing="2">SOLVED BY DIFFICULTY</text>
  <text x="1144" y="54" text-anchor="end" class="terminal" font-size="11" fill="#6e6e6e">20 PROBLEMS · 21 SOLUTIONS</text>

    <circle cx="62" cy="100" r="4" fill="#ffffff"/>
    <text x="80" y="105" class="sans" font-size="15" font-weight="600" fill="#f2f2f2">Easy</text>
    <text x="210" y="105" text-anchor="end" class="terminal" font-size="15" fill="#e6e6e6">13</text>
    <rect x="240" y="94" width="812" height="12" rx="6" fill="#2d2d2d"/>
    <rect class="bar d1" x="240" y="94" width="528" height="12" rx="6" fill="url(#g-easy)"/>
    <text x="1144" y="105" text-anchor="end" class="terminal" font-size="14" font-weight="700" fill="#ffffff">65%</text>
    <circle cx="62" cy="156" r="4" fill="#bdbdbd"/>
    <text x="80" y="161" class="sans" font-size="15" font-weight="600" fill="#f2f2f2">Medium</text>
    <text x="210" y="161" text-anchor="end" class="terminal" font-size="15" fill="#e6e6e6">6</text>
    <rect x="240" y="150" width="812" height="12" rx="6" fill="#2d2d2d"/>
    <rect class="bar d2" x="240" y="150" width="244" height="12" rx="6" fill="url(#g-medium)"/>
    <text x="1144" y="161" text-anchor="end" class="terminal" font-size="14" font-weight="700" fill="#bdbdbd">30%</text>
    <circle cx="62" cy="212" r="4" fill="#8a8a8a"/>
    <text x="80" y="217" class="sans" font-size="15" font-weight="600" fill="#f2f2f2">Hard</text>
    <text x="210" y="217" text-anchor="end" class="terminal" font-size="15" fill="#e6e6e6">1</text>
    <rect x="240" y="206" width="812" height="12" rx="6" fill="#2d2d2d"/>
    <rect class="bar d3" x="240" y="206" width="41" height="12" rx="6" fill="url(#g-hard)"/>
    <text x="1144" y="217" text-anchor="end" class="terminal" font-size="14" font-weight="700" fill="#8a8a8a">5%</text>

  <line x1="56" y1="236" x2="1144" y2="236" stroke="#2d2d2d"/>
  <text x="56" y="255" class="terminal" font-size="10" fill="#9e9e9e" letter-spacing="1.6">LANGUAGES</text>
    <circle cx="154" cy="251" r="3" fill="#ffffff"/>
    <text x="164" y="255" class="terminal" font-size="11" fill="#bdbdbd">C · 19</text>
    <circle cx="222" cy="251" r="3" fill="#9e9e9e"/>
    <text x="232" y="255" class="terminal" font-size="11" fill="#bdbdbd">Java · 2</text>
  <text x="1144" y="255" text-anchor="end" class="terminal" font-size="11" fill="#6e6e6e">solve · understand · improve</text>
</svg>
